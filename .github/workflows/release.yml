name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build-and-package:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0.'
          }
          "value=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore EdgeSwitch.csproj
      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: dotnet build EdgeSwitch.csproj -c Release --no-restore "-p:Version=$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
      - name: Run toolbar smoke checks
        run: pwsh -NoProfile -STA -File tests/ToolbarCaptureSmoke.ps1
      - name: Run plugin and settings smoke checks
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh -NoProfile -File tests/SettingsStoreSmoke.ps1
          pwsh.exe -NoProfile -NonInteractive -File tests/CopilotPluginSmoke.ps1
          pwsh -NoProfile -STA -File tests/PluginSmoke.ps1
      - name: Publish framework-dependent executable
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish EdgeSwitch.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false `
            "-p:Version=$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true -o artifacts/publish
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          Copy-Item -LiteralPath artifacts/publish/EdgeSwitch.exe -Destination artifacts/release/EdgeSwitch.exe
          New-Item -ItemType Directory -Path artifacts/portable -Force | Out-Null
          Copy-Item -LiteralPath artifacts/publish/EdgeSwitch.exe -Destination artifacts/portable/EdgeSwitch.exe
          Copy-Item -LiteralPath artifacts/publish/plugins -Destination artifacts/portable/plugins -Recurse
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/release/EdgeSwitch-portable.zip -Force
          $checksums = foreach ($name in @('EdgeSwitch.exe', 'EdgeSwitch-portable.zip')) {
            $hash = (Get-FileHash -LiteralPath "artifacts/release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$name"
          }
          [IO.File]::WriteAllText('artifacts/release/SHA256SUMS.txt', (($checksums -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release
          path: |
            artifacts/release/EdgeSwitch.exe
            artifacts/release/EdgeSwitch-portable.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: build-and-package
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-release
          path: artifacts/release
      - name: Verify and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $checksums = foreach ($name in @('EdgeSwitch.exe', 'EdgeSwitch-portable.zip')) {
            $hash = (Get-FileHash -LiteralPath "artifacts/release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$name"
          }
          $manifest = (Get-Content -LiteralPath artifacts/release/SHA256SUMS.txt -Raw).Trim()
          if ($manifest -cne ($checksums -join "`n")) { throw 'Release checksums do not match the assets.' }
          @'
          ## Windows x64 portable release

          Download **EdgeSwitch.exe** and run it on the machine that owns the application windows you want to switch.

          - Requires **Windows 10/11 x64** and the **[.NET 10 Desktop Runtime](https://dotnet.microsoft.com/en-us/download/dotnet/10.0)**.
          - The .NET runtime is **not bundled**. No application installation is required.
          - The executable is unsigned; Windows may display a reputation warning.
          - **EdgeSwitch-portable.zip** includes the executable and the optional Copilot toolbar plugin. Extract the entire ZIP into a writable folder.
          - The Copilot plugin requires PowerShell 7 (MSI installation with `pwsh.exe` on `PATH`) and GitHub CLI (`gh`). It is disabled until configured and enabled in Settings; execution policy is not bypassed.
          - **SHA256SUMS.txt** contains SHA-256 checksums for both downloads.

          ## Features

          - Compact application icons and Remote Desktop session labels.
          - Twelve screen-edge placements with hover activation limited to the toolbar's actual span.
          - Left-click the EdgeSwitch icon for the host desktop; right-click it for Settings.
          - Configurable captured executables, display selection, hide delay, and optional startup at Windows sign-in.
          - **Always maximize remote desktop sessions** setting (on by default): clicking a desktop session requests its title-bar Maximize action. The client controls whether this enters fullscreen; already-maximized or fullscreen sessions stay unchanged.

          ## Changed

          - Opt-in, language-independent toolbar plugins run as separate processes with bounded polling and cancellation. Only enable scripts you trust; plugins run with your Windows account permissions.
          - The bundled Copilot plugin displays cycle AI-credit consumption, allowance, reset date and selected account. Personal and managed accounts use their own `gh` authentication; GitHub's undocumented quota endpoint may change or be restricted by enterprise policy.
          - Toolbar settings now use UTF-8 `settings.ini` beside `EdgeSwitch.exe`, independent of the launch working directory. Move the INI with the executable to keep your preferences.
          - The executable's folder must be writable. Save errors are reported without a user-profile fallback; Windows startup registration remains per-user in the registry.

          The former user-profile `settings.json` is left untouched but is no longer read or imported. Reapply previous preferences in Settings and choose Save to create the INI. Missing INI files use defaults without creating a file.

          The release workflow builds and runs WPF/native-window smoke checks.
          Local checks verified INI roundtrips, failed-save rollback, the actual Settings Save/reload path, and an executable launched from a different working directory.
          Connected Remote Desktop session transitions and physical mixed-DPI display setups have not been verified.
          '@ | Set-Content -LiteralPath artifacts/release/notes.md -Encoding utf8
          gh release create $env:RELEASE_TAG artifacts/release/EdgeSwitch.exe artifacts/release/EdgeSwitch-portable.zip artifacts/release/SHA256SUMS.txt `
            --verify-tag --draft --title "EdgeSwitch $env:RELEASE_TAG" --notes-file artifacts/release/notes.md
          gh release edit $env:RELEASE_TAG --draft=false --latest
