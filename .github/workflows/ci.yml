name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build-and-smoke:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore EdgeSwitch.csproj
      - name: Build
        run: dotnet build EdgeSwitch.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Run toolbar smoke checks
        run: pwsh -NoProfile -STA -File tests/ToolbarCaptureSmoke.ps1
